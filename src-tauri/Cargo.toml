[package]
name = "school-calendar-widget"
version = "0.1.0"
description = "삼정중 학사일정 바탕화면 위젯"
edition = "2021"

[lib]
name = "school_calendar_widget_lib"
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
